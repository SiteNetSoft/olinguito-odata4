# Log4j 1.x configuration for tests
log4j.rootLogger=WARN, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c - %m%n

# Suppress verbose loggers
log4j.logger.org.springframework=ERROR
log4j.logger.org.springframework.util.xml=ERROR
log4j.logger.org.sitenetsoft.olinguito=ERROR
log4j.logger.org.apache.cxf=ERROR
log4j.logger.org.apache.cxf.rs.security.oauth2=ERROR
