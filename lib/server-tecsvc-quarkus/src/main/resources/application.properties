# Quarkus OData Technical Service Configuration
quarkus.http.port=8080

# OData extension configuration
olinguito.odata.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.sitenetsoft.olinguito".level=DEBUG

# Native image settings
# Disable HTTP compression to avoid Netty ZlibCodecFactory compatibility issues
quarkus.http.enable-compression=false
